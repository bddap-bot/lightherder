# The instrument, published. Every push to main rebuilds web/dist and hands it
# to GitHub Pages — the deployed page is whatever main last built, so there is
# no artefact checked in and nothing to keep in sync by hand.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Not cancel-in-progress: a cancelled deploy can leave
# the Pages deployment stuck, and a push that has to wait is cheaper than that.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      # The exact version Cargo.toml pins, as the released binary rather than
      # a build of it: web/build.sh refuses a mismatch anyway.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: ./web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
