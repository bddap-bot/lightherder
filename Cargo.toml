[package]
name = "lightherder"
version = "0.1.0"
edition = "2021"
description = "GPU video-feedback synthesizer"
license = "MIT OR Apache-2.0"

# `cdylib` is what wasm-bindgen turns into a module the page can import;
# `rlib` is what the binary and the test suite link against.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
# The overlay's typeface: a public-domain 8x8 bitmap font as const arrays.
# Pulled in as data rather than retyped here, and instead of a text-shaping
# stack, because a dozen two-word captions do not justify one.
font8x8 = { version = "0.3", default-features = false }
log = "0.4"
# `std::time::Instant` has no clock on wasm32 and panics on first use. This is
# that type everywhere else and `performance.now()` in a browser.
web-time = "1.1"
wgpu = "30.0.1"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
# Only `main` blocks; the browser drives the same futures off its own loop.
pollster = "1.0"
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
# Pinned exactly: the generated glue and the `wasm-bindgen` CLI that generates
# it must be the same version, and the CLI comes from the pinned nixpkgs.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "ContextAttributes2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "HtmlMediaElement",
  "HtmlVideoElement",
  "ImageData",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "Navigator",
  "Window",
] }
